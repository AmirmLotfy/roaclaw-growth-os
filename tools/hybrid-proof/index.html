<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ROACLAW · Firebase inference proof</title>
  </head>
  <body>
    <main>
      <header>ROACLAW / DEVELOPMENT CHECK</header>
      <h1>Firebase inference proof</h1>
      <p>These checks use a fixed synthetic product offer. The cloud and hybrid buttons authorize sending that sample to Firebase AI Logic.</p>
      <p><strong>Sample</strong> Sable &amp; Stem task lamp · $119 · Add to cart</p>
      <p id="setup" role="status">Reading configuration…</p>
      <div class="controls">
        <button id="local" disabled>Run on-device only</button>
        <button id="cloud" disabled>Run in cloud</button>
        <button id="hybrid" disabled>Run with cloud fallback</button>
      </div>
      <section aria-label="Inference result" aria-live="polite">
        <h2 id="source">No result</h2>
        <p id="detail"></p>
        <pre id="result" hidden></pre>
      </section>
    </main>
    <script src="/main.ts" type="module"></script>
  </body>
</html>
