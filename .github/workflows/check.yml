name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm exec --yes --package=pnpm@10.34.9 -- pnpm install --frozen-lockfile
      - run: npm exec --yes --package=pnpm@10.34.9 -- pnpm check
      - run: npm exec --yes --package=pnpm@10.34.9 -- pnpm test
      - run: node --test apps/extension/tests/*.test.js
      - run: npm exec --yes --package=pnpm@10.34.9 -- pnpm build
        env:
          # Static export initializes Auth during prerender. This configuration is for compilation only.
          NEXT_PUBLIC_FIREBASE_API_KEY: roaclaw-static-export-ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-roaclaw
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-roaclaw.invalid
